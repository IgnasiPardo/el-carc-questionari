<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>El Carç · Consulta individual</title><style>
:root{--ink:#242d26;--muted:#616b60;--green:#345b48;--pale:#e8eee8;--paper:#faf9f5;--line:#d9dfd5}*{box-sizing:border-box}body{margin:0;background:#f0f1eb;color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}header{background:#263f32;color:#fff;padding:22px 24px}header div{max-width:780px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-family:Georgia,serif;font-size:26px;letter-spacing:-.6px}.tag{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#dce5db}main{max-width:780px;margin:0 auto;padding:24px 16px 48px}.shell{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,38px);box-shadow:0 5px 22px #1e30200a}h1{font:normal clamp(26px,5vw,36px)/1.16 Georgia,serif;letter-spacing:-.6px;margin:8px 0 16px}h2{font-size:17px;margin:0 0 7px}p{margin:8px 0 15px}.muted,small{color:var(--muted)}.eyebrow{font-size:12px;color:var(--green);font-weight:700;letter-spacing:1px;text-transform:uppercase}.progress{height:6px;border-radius:6px;background:#dce2d9;overflow:hidden;margin:9px 0 20px}.progress div{height:100%;background:var(--green);transition:width .2s}.topline{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}.section{padding:22px 0;border-top:1px solid var(--line)}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.choice{position:relative;cursor:pointer;display:block}.choice input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer}.choice span{display:block;border:1px solid #c4cec2;border-radius:8px;text-align:center;padding:11px 5px;font-size:19px;font-weight:600;background:#fff}.choice input:checked+span{background:var(--green);border-color:var(--green);color:white}.choice input:focus-visible+span{outline:3px solid #a3b9a4;outline-offset:2px}.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:6px 0 12px}.unknown{display:flex;gap:9px;align-items:flex-start;font-size:14px;color:var(--muted);margin-top:10px}input[type=radio],input[type=checkbox]{accent-color:var(--green);width:18px;height:18px;flex-shrink:0;margin:3px 0 0}.item{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0;cursor:pointer}.item:has(input:checked){background:var(--pale);border-color:#75917c}.item:has(input:disabled){opacity:.52;cursor:default}.item:has(input:focus-visible){outline:2px solid var(--green)}.counter{font-size:13px;color:var(--green);font-weight:600;margin-top:10px}.actions{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}button{font:inherit;font-weight:600;border:1px solid var(--green);border-radius:8px;padding:11px 18px;background:var(--green);color:white;cursor:pointer}button.secondary{background:transparent;color:var(--green);border-color:#b9c6b8}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible{outline:3px solid #a3b9a4;outline-offset:2px}.note{padding:14px 16px;background:var(--pale);border-radius:8px;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.stat{border-top:2px solid #8fa18f;padding-top:10px}.stat b{display:block;font:normal 32px Georgia,serif}.stat span{font-size:12px;color:var(--muted)}textarea{width:100%;font:inherit;resize:vertical;min-height:120px;border:1px solid #c4cec2;border-radius:8px;padding:12px;background:#fff}details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:600}details p{font-size:14px}a{color:var(--green)}footer{text-align:center;font-size:12px;color:var(--muted);padding:18px}#err{color:#963a2b;font-size:14px}.reviewrow{display:flex;gap:10px;justify-content:space-between;align-items:center}.reviewrow button{font-size:12px;padding:5px 9px}.pill{display:inline-block;background:var(--pale);font-size:12px;padding:3px 8px;border-radius:4px;margin:2px}.selected{font-size:14px;color:var(--muted);margin:5px 0} @media(max-width:400px){button{padding:10px 12px}.tag{max-width:90px;text-align:right}.scale{gap:5px}} </style></head><body><header><div><span class="brand">El Carç</span><span class="tag">Prototip de consulta</span></div></header><main><div id="app" class="shell"></div><footer>Demostració local · No s'envien ni es registren respostes en cap servidor.</footer></main><script>
const axes=[["Patrimoni edificat i masia", ["Conservació estructural de la masia: cobertes, bigues i manteniment.", "Rehabilitació i conservació de la torre, la capella i altres elements patrimonials.", "Disponibilitat de la masia per als propietaris, reserves i calendari compartit."]], ["Urbanisme, legalització i usos", ["Estat, requeriments i possibilitats reals del Pla especial d’usos.", "Situació urbanística de la nau i usos que pot acollir.", "Regularització dels usos residencials i dels espais auxiliars.", "Cobertura administrativa dels esdeveniments i altres activitats actuals."]], ["Esdeveniments i lloguer d’espais", ["Model d’esdeveniments: volum, tipologia, preus i posicionament.", "Nous ingressos recurrents mitjançant el lloguer d’espais de la nau.", "Proposta de valor i millores necessàries per atreure esdeveniments de més valor.", "Impacte dels esdeveniments sobre les instal·lacions, l’entorn i el veïnat."]], ["Vinya, agricultura i reg", ["Petició actual d’arrencada de vinyes i conseqüències d’autoritzar-la.", "Titularitat i situació dels drets i autoritzacions de plantació i replantació.", "Futur de les vinyes actuals: envelliment, sequera i possibles renovacions.", "Viabilitat econòmica de l’explotació vitícola: rendiments, costos i inversions.", "Possibilitats de reg agrícola i relació amb la comunitat de regants.", "Conservació dels garrofers i altres conreus de secà.", "Estat de les oliveres, manteniment i situació de la collita d’oli.", "Possibles productes agraris propis, especialment vi i oli, com a línia futura a explorar."]], ["Ramaderia, pastures i carn", ["Continuïtat de l’activitat ramadera i relleu del pastor actual.", "Viabilitat del model ramader, producció de carn i alternatives de gestió.", "Funció de les pastures en el manteniment del paisatge i la prevenció d’incendis."]], ["Gestió forestal, camins i accessos", ["Inventari i pla de gestió forestal amb diagnosi tècnica sobre el terreny.", "Prevenció d’incendis, gestió de biomassa i intervencions forestals.", "Estat, manteniment i funcionalitat dels camins i accessos."]], ["Aigua, pous i sanejament", ["Inventari físic dels pous, dipòsits, conduccions i xarxes d’aigua.", "Cabals, qualitat i garantia de subministrament d’aigua de la masia.", "Situació administrativa dels pous i relació amb l’ACA.", "Sanejament, lavabos, desguassos i alternatives de connexió a la xarxa pública."]], ["Ordenació territorial i fotovoltaica", ["Delimitació i protecció del nucli patrimonial i paisatgístic de la finca.", "Continuïtat territorial, parcel·les enclavades i situació de Terramar/Autòdrom.", "Conseqüències territorials, patrimonials i econòmiques del projecte fotovoltaic sobre El Carç."]], ["Economia i inversions", ["Coneixement dels ingressos, costos i resultats reals de totes les activitats.", "Pressupost anual, tresoreria, aportacions dels propietaris i control de desviacions.", "Necessitats d’inversió a llarg termini i model de finançament del sosteniment patrimonial."]], ["Relacions institucionals i aliances", ["Relacions amb administracions, entitats agràries i forestals, aliances i oportunitats d’ajuts."]], ["Contractes i ocupacions", ["Condicions de l’explotació agrària amb Josep Pasqual: contractes, liquidacions, ajuts i obligacions.", "Condicions de l’activitat pastoral: drets d’ús, contraprestacions i responsabilitats.", "Situació dels masovers, residents i altres ocupacions: drets, serveis i contraprestacions.", "Acords amb aeromodelisme i altres usos o cessions a tercers."]], ["Cartografia i documentació", ["Cartografia digital integrada: cadastre, registre, SIGPAC, pous, camins, usos i riscos.", "Sistema documental compartit, informació patrimonial i traçabilitat de les actuacions."]]];const answers=axes.map(()=>({crit:null,cap:null,selected:[],none:false}));let step=-1,notes='',returnReview=false;const app=document.querySelector('#app');const maxFor=n=>n===1?0:n<=3?1:n<=7?2:3;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const label=v=>v==='?'?'Sense prou informació':v===null?'Sense resposta':v+'/5';
function top(){let done=answers.filter(a=>a.crit!==null&&a.cap!==null).length;return `<div class="topline"><span>${step<12?'Eix '+(step+1)+' de 12':'Revisió de respostes'}</span><span>${done}/12 eixos valorats</span></div><div class="progress" role="progressbar" aria-valuenow="${done}" aria-valuemax="12"><div style="width:${done/12*100}%"></div></div>`}
function scale(key,title,desc,low,high){let a=answers[step];return `<section class="section"><h2>${title}</h2><p class="muted">${desc}</p><div class="scale" role="group" aria-label="${title}">${[1,2,3,4,5].map(n=>`<label class="choice"><input type="radio" name="${key}" value="${n}" ${a[key]===n?'checked':''} onchange="rate('${key}',${n})" aria-label="${title}: ${n}"><span>${n}</span></label>`).join('')}</div><div class="ends"><span>${low}</span><span>${high}</span></div><label class="unknown"><input type="radio" name="${key}" ${a[key]==='?'?'checked':''} onchange="rate('${key}','?')">No disposo de prou informació per valorar-ho.</label></section>`}
function render(scroll=true){if(step===-1){app.innerHTML=`<div class="eyebrow">Consulta individual als propietaris</div><h1>Què mereix una atenció preferent a El Carç?</h1><p>Ens interessa conèixer la teva percepció sobre els diferents fronts de treball de la finca i les qüestions concretes que consideres més importants.</p><div class="stats"><div class="stat"><b>12</b><span>Eixos de treball</span></div><div class="stat"><b>24</b><span>Valoracions breus</span></div><div class="stat"><b>11</b><span>Seleccions per eix</span></div></div><p>En cada eix et demanarem dues valoracions de l’1 al 5 i, quan hi hagi diverses qüestions, que en seleccionis les que mereixen una atenció preferent. No cal tenir coneixement tècnic de tots els temes.</p><div class="note">Les respostes són consultives. La direcció estratègica les contrastarà amb el coneixement tècnic i les dependències entre actuacions per establir les prioritats de treball.</div><div class="actions"><small>Prototip per provar el recorregut</small><button onclick="go(0)">Començar</button></div>`}else if(step<12){let [name,items]=axes[step],a=answers[step],max=maxFor(items.length);app.innerHTML=top()+`<div class="eyebrow">${step<8?'Àmbit d’actuació':'Dimensió transversal'}</div><h1>${esc(name)}</h1>`+scale('crit','1. Criticitat','Quina importància té abordar aquest eix, considerant les conseqüències de no fer-ho?','Molt baixa','Molt alta')+scale('cap','2. Capacitat d’avançar','En quina mesura consideres que actualment hi ha condicions per començar a avançar en aquest eix?','Molt escasses','Molt favorables')+`<section class="section"><h2>${max?'3. Qüestions d’atenció preferent':'Qüestió associada'}</h2>${max?`<p class="muted">Quines qüestions haurien de rebre una atenció preferent per part de la direcció estratègica? Selecciona ${max===1?'com a màxim una qüestió':'fins a '+max+' qüestions'}.</p><div id="items">${items.map((s,i)=>`<label class="item"><input type="checkbox" ${a.selected.includes(i)?'checked':''} ${a.selected.length>=max&&!a.selected.includes(i)?'disabled':''} onchange="selectItem(${i},this.checked)"><span>${esc(s)}</span></label>`).join('')}</div><label class="unknown"><input type="checkbox" id="none" ${a.none?'checked':''} onchange="setNone(this.checked)">No en destacaria cap o no tinc prou criteri per escollir-ne.</label><div class="counter" id="count" aria-live="polite">${a.selected.length} de ${max} seleccionades</div>`:`<p class="muted">Aquest eix només conté una qüestió. No cal triar entre alternatives.</p><div class="note">${esc(items[0])}</div>`}</section><div id="err" role="alert"></div><div class="actions"><button class="secondary" onclick="go(${step-1})">Anterior</button><button onclick="next()">${returnReview?'Tornar a la revisió':step===11?'Revisar respostes':'Següent'}</button></div>`;}else{app.innerHTML=top()+`<h1>Revisió i observacions finals</h1><p>Pots revisar les teves valoracions i tornar a qualsevol eix abans de finalitzar.</p>${axes.map(([name,items],i)=>{let a=answers[i];return `<details><summary>${esc(name)}</summary><div class="reviewrow"><div><span class="pill">Criticitat: ${label(a.crit)}</span><span class="pill">Capacitat: ${label(a.cap)}</span></div><button class="secondary" onclick="edit(${i})">Editar</button></div>${a.selected.map(j=>`<div class="selected">– ${esc(items[j])}</div>`).join('')||`<p class="muted">${items.length===1?'Una única qüestió associada.':a.none?'Cap qüestió destacada / sense criteri.':'Cap qüestió seleccionada.'}</p>`}</details>`}).join('')}<section class="section"><h2>Hi ha alguna qüestió rellevant que no s’hagi recollit, o alguna observació que vulguis fer?</h2><p class="muted">Resposta opcional.</p><textarea id="notes" oninput="notes=this.value" placeholder="Escriu aquí les teves observacions...">${esc(notes)}</textarea></section><div class="note">Aquesta és una demostració. En finalitzar no es tramet cap resposta.</div><div class="actions"><button class="secondary" onclick="go(11)">Anterior</button><button onclick="finish()">Finalitzar prova</button></div>`}if(scroll)window.scrollTo(0,0)}
function go(n){step=n;returnReview=false;render()}function edit(i){step=i;returnReview=true;render()}function rate(key,v){answers[step][key]=v;const done=answers.filter(a=>a.crit!==null&&a.cap!==null).length;document.querySelector('.topline span:last-child').textContent=done+'/12 eixos valorats';document.querySelector('.progress div').style.width=done/12*100+'%';document.querySelector('.progress').setAttribute('aria-valuenow',done);document.querySelector('#err').textContent=''}function refreshItems(){let a=answers[step],max=maxFor(axes[step][1].length);document.querySelectorAll('#items input').forEach((el,i)=>{el.checked=a.selected.includes(i);el.disabled=a.selected.length>=max&&!el.checked});document.querySelector('#none').checked=a.none;document.querySelector('#count').textContent=a.selected.length+' de '+max+' seleccionades'}function selectItem(i,on){let a=answers[step];if(on){if(a.selected.length<maxFor(axes[step][1].length))a.selected.push(i);a.none=false}else a.selected=a.selected.filter(j=>j!==i);refreshItems()}function setNone(on){let a=answers[step];a.none=on;if(on)a.selected=[];refreshItems()}function next(){let a=answers[step];if(a.crit===null||a.cap===null){document.querySelector('#err').textContent='Cal respondre les dues valoracions (o indicar que no disposes de prou informació).';return}if(returnReview){go(12)}else go(step+1)}function finish(){let missing=answers.findIndex(a=>a.crit===null||a.cap===null);if(missing>=0){edit(missing);return}app.innerHTML=`<div class="eyebrow">Prova completada</div><h1>Gràcies per la teva aportació.</h1><p>Has completat les 24 valoracions. En el qüestionari definitiu, aquestes respostes es recollirien per a l’anàlisi de la direcció estratègica.</p><div class="note">No s’ha enviat cap informació. Pots revisar el que has respost o tornar a començar.</div><div class="actions"><button class="secondary" onclick="go(12)">Revisar</button><button onclick="reset()">Tornar a començar</button></div>`;window.scrollTo(0,0)}function reset(){answers.forEach(a=>{a.crit=null;a.cap=null;a.selected=[];a.none=false});notes='';go(-1)}render();</script></body></html>
