<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>El Carç · Consulta individual</title><style>
:root{--ink:#242d26;--muted:#616b60;--green:#345b48;--pale:#e8eee8;--paper:#faf9f5;--line:#d9dfd5}*{box-sizing:border-box}body{margin:0;background:#f0f1eb;color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}header{background:#263f32;color:#fff;padding:22px 24px}header div{max-width:780px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-family:Georgia,serif;font-size:26px;letter-spacing:-.6px}.tag{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#dce5db}main{max-width:780px;margin:0 auto;padding:24px 16px 48px}.shell{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,38px);box-shadow:0 5px 22px #1e30200a}h1{font:normal clamp(26px,5vw,36px)/1.16 Georgia,serif;letter-spacing:-.6px;margin:8px 0 16px}h2{font-size:17px;margin:0 0 7px}p{margin:8px 0 15px}.muted,small{color:var(--muted)}.eyebrow{font-size:12px;color:var(--green);font-weight:700;letter-spacing:1px;text-transform:uppercase}.progress{height:6px;border-radius:6px;background:#dce2d9;overflow:hidden;margin:9px 0 20px}.progress div{height:100%;background:var(--green);transition:width .2s}.topline{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}.section{padding:22px 0;border-top:1px solid var(--line)}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.choice{position:relative;cursor:pointer;display:block}.choice input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer}.choice span{display:block;border:1px solid #c4cec2;border-radius:8px;text-align:center;padding:11px 5px;font-size:19px;font-weight:600;background:#fff}.choice input:checked+span{background:var(--green);border-color:var(--green);color:white}.choice input:focus-visible+span{outline:3px solid #a3b9a4;outline-offset:2px}.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:6px 0 12px}.unknown{display:flex;gap:9px;align-items:flex-start;font-size:14px;color:var(--muted);margin-top:10px}input[type=radio],input[type=checkbox]{accent-color:var(--green);width:18px;height:18px;flex-shrink:0;margin:3px 0 0}.item{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0;cursor:pointer}.item:has(input:checked){background:var(--pale);border-color:#75917c}.item:has(input:disabled){opacity:.52;cursor:default}.item:has(input:focus-visible){outline:2px solid var(--green)}.counter{font-size:13px;color:var(--green);font-weight:600;margin-top:10px}.actions{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}button{font:inherit;font-weight:600;border:1px solid var(--green);border-radius:8px;padding:11px 18px;background:var(--green);color:white;cursor:pointer}button.secondary{background:transparent;color:var(--green);border-color:#b9c6b8}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible{outline:3px solid #a3b9a4;outline-offset:2px}.note{padding:14px 16px;background:var(--pale);border-radius:8px;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.stat{border-top:2px solid #8fa18f;padding-top:10px}.stat b{display:block;font:normal 32px Georgia,serif}.stat span{font-size:12px;color:var(--muted)}textarea{width:100%;font:inherit;resize:vertical;min-height:120px;border:1px solid #c4cec2;border-radius:8px;padding:12px;background:#fff}details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:600}details p{font-size:14px}a{color:var(--green)}footer{text-align:center;font-size:12px;color:var(--muted);padding:18px}#err{color:#963a2b;font-size:14px}.reviewrow{display:flex;gap:10px;justify-content:space-between;align-items:center}.reviewrow button{font-size:12px;padding:5px 9px}.pill{display:inline-block;background:var(--pale);font-size:12px;padding:3px 8px;border-radius:4px;margin:2px}.selected{font-size:14px;color:var(--muted);margin:5px 0} @media(max-width:400px){button{padding:10px 12px}.tag{max-width:90px;text-align:right}.scale{gap:5px}} .question-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px, .95fr);align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.question-row:last-child{border-bottom:0}.attention{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.attention .choice span{font-size:13px;padding:11px 3px;white-space:nowrap;line-height:1.3}.question-label{font-size:15px;line-height:1.45}.question-num{font-size:12px;color:var(--muted);margin-right:5px}.name-input{width:100%;font:inherit;padding:12px;border:1px solid #c4cec2;border-radius:8px;background:#fff}.review-items{margin:10px 0 0;padding:0;list-style:none}.review-items li{padding:7px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-size:14px}.review-items li b{font-size:12px;color:var(--green);white-space:nowrap}.export-actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.export-actions button{flex:1;min-width:145px}.actions{flex-wrap:wrap}.notice{font-size:14px;color:var(--muted)}@media(max-width:600px){.question-row{grid-template-columns:1fr;gap:8px;padding:14px 0}.attention .choice span{font-size:14px;padding:12px 3px}.review-items li{gap:8px}}</style></head><body><header><div><span class="brand">El Carç</span><span class="tag">Prototip de consulta · v3</span></div></header><main><div id="app" class="shell"><h1>Consulta individual als propietaris</h1><p>Carregant el qüestionari…</p><noscript>Cal activar JavaScript al navegador per respondre el qüestionari.</noscript></div><footer>Prototip de treball · Exportació de respostes · Sense connexió a Google Sheets</footer></main><script>
const axes=[["Patrimoni edificat i masia",["Conservació estructural de la masia: cobertes, bigues i manteniment.","Rehabilitació i conservació de la torre, la capella i altres elements patrimonials.","Disponibilitat de la masia per als propietaris, reserves i calendari compartit."]],["Urbanisme, legalització i usos",["Estat, requeriments i possibilitats reals del Pla especial d’usos.","Situació urbanística de la nau i usos que pot acollir.","Regularització dels usos residencials i dels espais auxiliars.","Cobertura administrativa dels esdeveniments i altres activitats actuals."]],["Esdeveniments i lloguer d’espais",["Model d’esdeveniments: volum, tipologia, preus i posicionament.","Nous ingressos recurrents mitjançant el lloguer d’espais de la nau.","Proposta de valor i millores necessàries per atreure esdeveniments de més valor.","Impacte dels esdeveniments sobre les instal·lacions, l’entorn i el veïnat."]],["Vinya, agricultura i reg",["Petició actual d’arrencada de vinyes i conseqüències d’autoritzar-la.","Titularitat i situació dels drets i autoritzacions de plantació i replantació.","Futur de les vinyes actuals: envelliment, sequera i possibles renovacions.","Viabilitat econòmica de l’explotació vitícola: rendiments, costos i inversions.","Possibilitats de reg agrícola i relació amb la comunitat de regants.","Conservació dels garrofers i altres conreus de secà.","Estat de les oliveres, manteniment i situació de la collita d’oli.","Possibles productes agraris propis, especialment vi i oli, com a línia futura a explorar."]],["Ramaderia, pastures i carn",["Continuïtat de l’activitat ramadera i relleu del pastor actual.","Viabilitat del model ramader, producció de carn i alternatives de gestió.","Funció de les pastures en el manteniment del paisatge i la prevenció d’incendis."]],["Gestió forestal, camins i accessos",["Inventari i pla de gestió forestal amb diagnosi tècnica sobre el terreny.","Prevenció d’incendis, gestió de biomassa i intervencions forestals.","Estat, manteniment i funcionalitat dels camins i accessos."]],["Aigua, pous i sanejament",["Inventari físic dels pous, dipòsits, conduccions i xarxes d’aigua.","Cabals, qualitat i garantia de subministrament d’aigua de la masia.","Situació administrativa dels pous i relació amb l’ACA.","Sanejament, lavabos, desguassos i alternatives de connexió a la xarxa pública."]],["Ordenació territorial i fotovoltaica",["Delimitació i protecció del nucli patrimonial i paisatgístic de la finca.","Continuïtat territorial, parcel·les enclavades i situació de Terramar/Autòdrom.","Conseqüències territorials, patrimonials i econòmiques del projecte fotovoltaic sobre El Carç."]],["Economia i inversions",["Coneixement dels ingressos, costos i resultats reals de totes les activitats.","Pressupost anual, tresoreria, aportacions dels propietaris i control de desviacions.","Necessitats d’inversió a llarg termini i model de finançament del sosteniment patrimonial."]],["Relacions institucionals i aliances",["Relacions amb administracions, entitats agràries i forestals, aliances i oportunitats d’ajuts."]],["Contractes i ocupacions",["Condicions de l’explotació agrària amb Josep Pasqual: contractes, liquidacions, ajuts i obligacions.","Condicions de l’activitat pastoral: drets d’ús, contraprestacions i responsabilitats.","Situació dels masovers, residents i altres ocupacions: drets, serveis i contraprestacions.","Acords amb aeromodelisme i altres usos o cessions a tercers."]],["Cartografia i documentació",["Cartografia digital integrada: cadastre, registre, SIGPAC, pous, camins, usos i riscos.","Sistema documental compartit, informació patrimonial i traçabilitat de les actuacions."]]];
const answers=axes.map(([name,items])=>({crit:null,cap:null,attention:items.map(()=>null)}));
const app=document.querySelector('#app');
let step=-1,notes='',respondent='',returnReview=false,completedAt='';
const attentionOptions=[[1,'Baix'],[2,'Mitjà'],[3,'Alt'],['?','NS']];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const generalLabel=v=>v==='?'?'Sense prou informació':v===null?'Sense resposta':v+'/5';
const attentionLabel=v=>v===null?'Sense resposta':v==='?'?'Sense informació':attentionOptions.find(x=>x[0]===v)?.[1]||'';
const completeAxis=a=>a.crit!==null&&a.cap!==null&&a.attention.every(v=>v!==null);
const completedCount=()=>answers.reduce((n,a)=>n+Number(a.crit!==null)+Number(a.cap!==null)+a.attention.filter(v=>v!==null).length,0);
function renderProgress(){const done=completedCount();return '<div class="topline"><span>'+(step<12?'Eix '+(step+1)+' de 12':'Revisió de respostes')+'</span><span id="progressLabel">'+done+'/66 valoracions</span></div><div class="progress" role="progressbar" aria-label="Valoracions completades" aria-valuenow="'+done+'" aria-valuemax="66"><div style="width:'+(done/66*100)+'%"></div></div>'}
function refreshProgress(){const n=completedCount();document.querySelector('#progressLabel').textContent=n+'/66 valoracions';document.querySelector('.progress div').style.width=n/66*100+'%';document.querySelector('.progress').setAttribute('aria-valuenow',n);document.querySelector('#err').textContent='';const counter=document.querySelector('#attentionCount');if(counter)counter.textContent=answers[step].attention.filter(v=>v!==null).length+' de '+axes[step][1].length+' qüestions valorades'}
function scale(key,title,desc,low,high){let a=answers[step];return '<section class="section"><h2>'+title+'</h2><p class="muted">'+desc+'</p><div class="scale" role="group" aria-label="'+title+'">'+[1,2,3,4,5].map(n=>'<label class="choice"><input type="radio" name="'+key+'" value="'+n+'" '+(a[key]===n?'checked':'')+' onchange="rate(\''+key+'\','+n+')" aria-label="'+title+': '+n+'"><span>'+n+'</span></label>').join('')+'</div><div class="ends"><span>'+low+'</span><span>'+high+'</span></div><label class="unknown"><input type="radio" name="'+key+'" '+(a[key]==='?'?'checked':'')+' onchange="rate(\''+key+'\',\'?\')">No disposo de prou informació per valorar-ho.</label></section>'}
function renderQuestions(items,a){return '<section class="section"><h2>3. Nivell d’atenció de cada qüestió</h2><p>Quin nivell d’atenció consideres que hauria de rebre cadascuna d’aquestes qüestions per part de la direcció estratègica?</p><p class="muted">Valora-les de manera independent. Pots assignar el mateix nivell a diverses qüestions. NS = No disposo de prou informació.</p>'+items.map((q,i)=>'<div class="question-row"><div class="question-label" id="q-label-'+i+'"><span class="question-num">'+(i+1)+'.</span>'+esc(q)+'</div><div class="attention" role="radiogroup" aria-labelledby="q-label-'+i+'">'+attentionOptions.map(([v,l])=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+v+'" '+(a.attention[i]===v?'checked':'')+' onchange="rateAttention('+i+',this.value)" aria-label="'+(v==='?'?'No disposo de prou informació':l)+'"><span>'+l+'</span></label>').join('')+'</div></div>').join('')+'<div class="counter" id="attentionCount" aria-live="polite">'+a.attention.filter(v=>v!==null).length+' de '+items.length+' qüestions valorades</div></section>'}
function render(scroll=true){
if(step===-1){
app.innerHTML='<div class="eyebrow">Consulta individual als propietaris</div><h1>Què mereix una atenció preferent a El Carç?</h1><p>Ens interessa conèixer la teva percepció sobre els diferents fronts de treball de la finca i les qüestions concretes que consideres més importants.</p><div class="stats"><div class="stat"><b>12</b><span>Eixos de treball</span></div><div class="stat"><b>24</b><span>Valoracions generals</span></div><div class="stat"><b>42</b><span>Valoracions de qüestions</span></div></div><p>En cada eix et demanarem dues valoracions generals de l’1 al 5. Després, podràs indicar el nivell d’atenció de cadascuna de les qüestions associades: baix, mitjà o alt.</p><div class="note">Les respostes són consultives. La direcció estratègica les contrastarà amb el coneixement tècnic i les dependències entre actuacions per establir les prioritats de treball.</div><section class="section" style="margin-top:22px"><h2><label for="respondent">Nom</label></h2><p class="muted">Opcional en aquesta prova.</p><input class="name-input" id="respondent" type="text" autocomplete="name" value="'+esc(respondent)+'" oninput="respondent=this.value" placeholder="Nom del participant"></section><div class="actions"><small>Prototip · Les dades no s’envien automàticament</small><button onclick="go(0)">Començar</button></div>';
}else if(step<12){
const [name,items]=axes[step],a=answers[step];app.innerHTML=renderProgress()+'<div class="eyebrow">'+(step<8?'Àmbit d’actuació':'Dimensió transversal')+'</div><h1>'+esc(name)+'</h1>'+scale('crit','1. Criticitat','Quina importància té abordar aquest eix, considerant les conseqüències de no fer-ho?','Molt baixa','Molt alta')+scale('cap','2. Capacitat d’avançar','En quina mesura consideres que actualment hi ha condicions per començar a avançar en aquest eix?','Molt escasses','Molt favorables')+renderQuestions(items,a)+'<div id="err" role="alert"></div><div class="actions"><button class="secondary" onclick="previous()">'+(returnReview?'Tornar a la revisió':'Anterior')+'</button><button onclick="next()">'+(returnReview?'Desar i revisar':step===11?'Revisar respostes':'Següent')+'</button></div>';
}else if(step===12){
app.innerHTML=renderProgress()+'<h1>Revisió i observacions finals</h1><p>Pots revisar les teves valoracions i tornar a qualsevol eix abans de finalitzar.</p><p class="muted">Participant: '+esc(respondent||'Sense identificar')+'</p>'+axes.map(([name,items],i)=>{const a=answers[i];return '<details><summary>'+esc(name)+(completeAxis(a)?'':' · Pendent')+'</summary><div class="reviewrow"><div><span class="pill">Criticitat: '+generalLabel(a.crit)+'</span><span class="pill">Capacitat: '+generalLabel(a.cap)+'</span></div><button class="secondary" onclick="edit('+i+')">Editar</button></div><ul class="review-items">'+items.map((q,j)=>'<li><span>'+esc(q)+'</span><b>'+attentionLabel(a.attention[j])+'</b></li>').join('')+'</ul></details>'}).join('')+'<section class="section"><h2><label for="notes">Hi ha alguna qüestió rellevant que no s’hagi recollit, o alguna observació que vulguis fer?</label></h2><p class="muted">Resposta opcional.</p><textarea id="notes" oninput="notes=this.value" placeholder="Escriu aquí les teves observacions...">'+esc(notes)+'</textarea></section><div class="note">En finalitzar podràs descarregar les respostes en CSV, o copiar-les per enganxar-les a Google Sheets. La connexió automàtica encara no està activa.</div><div class="actions"><button class="secondary" onclick="go(11)">Anterior</button><button onclick="finish()">Finalitzar</button></div>';
}else{
app.innerHTML='<div class="eyebrow">Qüestionari completat</div><h1>Respostes preparades</h1><p>Has completat les 66 valoracions. Pots conservar les teves respostes mitjançant les opcions següents.</p><div class="export-actions"><button onclick="downloadCSV()">Descarregar CSV</button><button class="secondary" onclick="copyTSV()">Copiar per a Sheets</button></div><p id="exportStatus" role="status" class="notice"></p><div class="note">Les respostes només són en aquesta sessió fins que les exportis. Encara no s’han enviat a Google Sheets ni a la direcció estratègica.</div><div class="actions"><button class="secondary" onclick="go(12)">Revisar respostes</button><button class="secondary" onclick="reset()">Tornar a començar</button></div>';
}if(scroll)window.scrollTo(0,0)}
function go(n){step=n;returnReview=false;render()}
function previous(){if(returnReview)go(12);else go(step-1)}
function edit(i){step=i;returnReview=true;render()}
function rate(key,v){answers[step][key]=v;refreshProgress()}
function rateAttention(i,v){answers[step].attention[i]=v==='?'?'?':Number(v);refreshProgress()}
function next(){const a=answers[step];if(!completeAxis(a)){document.querySelector('#err').textContent='Cal completar les valoracions generals i les de cada qüestió. Si no tens prou informació, marca l’opció corresponent.';return}go(returnReview?12:step+1)}
function finish(){const missing=answers.findIndex(a=>!completeAxis(a));if(missing>=0){edit(missing);return}completedAt=new Date().toISOString();go(13)}
function exportRows(){const headers=['Versió','Participant','Data de finalització'];const values=['3',respondent,completedAt];axes.forEach(([name,items],i)=>{const a=answers[i];const prefix='E'+String(i+1).padStart(2,'0')+' · '+name;headers.push(prefix+' · Criticitat',prefix+' · Capacitat d’avançar');values.push(a.crit,a.cap);items.forEach((q,j)=>{headers.push(prefix+' · Q'+String(j+1).padStart(2,'0')+' · '+q+' · Atenció');values.push(a.attention[j])})});headers.push('Observacions');values.push(notes);return [headers,values]}
function safeCell(v){let s=String(v??'');return /^\s*[=+\-@]/.test(s)?"'"+s:s}
function csvCell(v){return '"'+safeCell(v).replace(/"/g,'""')+'"'}
function downloadCSV(){const csv='\uFEFF'+exportRows().map(row=>row.map(csvCell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='el-carc-respostes-'+completedAt.slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);document.querySelector('#exportStatus').textContent='S’ha sol·licitat la descàrrega del CSV. Comprova que el fitxer s’hagi desat.'}
async function copyTSV(){const tsv=exportRows().map(row=>row.map(v=>safeCell(v).replace(/[\t\r\n]+/g,' ')).join('\t')).join('\n');try{await navigator.clipboard.writeText(tsv);document.querySelector('#exportStatus').textContent='Respostes copiades. Enganxa-les a la cel·la A1 d’un full buit de Google Sheets.'}catch(e){document.querySelector('#exportStatus').textContent='No s’ha pogut copiar al porta-retalls. Descarrega el CSV.'}}
function reset(){if(!confirm('Vols esborrar les respostes d’aquesta sessió?'))return;answers.forEach(a=>{a.crit=null;a.cap=null;a.attention.fill(null)});notes='';respondent='';completedAt='';go(-1)}
try{render()}catch(error){app.textContent='No s’ha pogut iniciar el qüestionari. '+error.message;console.error(error)}
</script></body></html>
